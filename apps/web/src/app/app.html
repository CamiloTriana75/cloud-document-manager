<a class="skip-link" href="#main">Saltar al contenido principal</a>

<header class="app-header">
  <a routerLink="/" class="brand">
    <svg
      class="brand-icon"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
      <path d="M14 2v6h6" />
    </svg>
    <span>Cloud Document Manager</span>
  </a>

  <nav class="nav-actions" aria-label="Navegación de usuario">
    @if (authService.isAuthenticated()) {
      <div class="user-menu">
        <app-workspace-selector />
        <span class="user-badge" [title]="authService.currentUser()?.email">
          {{ authService.currentUser()?.name || authService.currentUser()?.email }}
        </span>
        <button
          type="button"
          class="btn-nav btn-logout"
          (click)="onLogout()"
        >
          Cerrar sesión
        </button>
      </div>
    } @else {
      <div class="auth-links">
        <a routerLink="/auth/login" class="nav-link">Iniciar sesión</a>
        <a routerLink="/auth/register" class="btn-nav btn-register">Crear cuenta</a>
      </div>
    }
  </nav>
</header>

<main id="main" class="app-main">
  <router-outlet />
</main>
