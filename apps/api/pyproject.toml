[project]
name = "cdm-api"
version = "0.1.0"
description = "Cloud Document Manager — API (FastAPI, arquitectura hexagonal)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.37.0",
    "pydantic==2.11.9",
    "pydantic-settings==2.10.1",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.9",
    "mangum==0.19.0",
    "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "httpx==0.28.1",
    "ruff==0.14.0",
    "mypy==1.18.2",
]

[build-system]
requires = ["uv_build>=0.9,<1.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cdm"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# E501 lo maneja el formatter con line-length.

[tool.ruff.lint.isort]
known-first-party = ["cdm"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["cdm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
